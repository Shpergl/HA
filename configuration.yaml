#     turn_on_action:
#       - service: wake_on_lan.send_magic_packet
#         data:
#           mac: A0:D7:F3:6D:1D:A6

logger:
  default: debug

telegram_bot:
  - platform: polling
    api_key: !secret api_key_bot
    parse_mode: html
    allowed_chat_ids:
      - !secret telegram_id_alex
      - !secret telegram_id_anna
      - !secret telegram_id_mama

notify:
  - name: telegram_alex
    platform: telegram
    chat_id: !secret telegram_id_alex

  - name: telegram_anna
    platform: telegram
    chat_id: !secret telegram_id_anna

  - name: telegram_mama
    platform: telegram
    chat_id: !secret telegram_id_mama

  - name: telegram_all
    platform: group
    services:
      - service: telegram_alex
      - service: telegram_anna
      - service: telegram_mama
