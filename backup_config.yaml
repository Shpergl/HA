# yaml-language-server: $schema=http://frigate_host:5000/api/config/schema.json

mqtt:
  enabled: True
  host: 192.168.1.228
  port: 1883
  topic_prefix: frigate
  client_id: frigate
  user: mqtt
  password: mqtt
  stats_interval: 60

cameras:
  front_door:
    enabled: True
    ffmpeg:
      inputs:
        - path: rtsp://HomeAssistant:IOT6316!@192.168.1.20:554//h264Preview_01_sub
          roles:
            - audio
    detect:
      enabled: False

    audio:
      enabled: True
      listen:
        - bark
        - scream
        - yell
        - howl
        - bow-wow
        - growling
        - whimper_dog

version: 0.14
