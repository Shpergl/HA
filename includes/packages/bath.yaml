bath:
  homeassistant:
    customize:
      light.bath_light:
        friendly_name: Ванна
      fan.bath_fan:
        friendly_name: Вентиляція у ванній
      switch.aqara_switch_relay_toilet_l1:
        friendly_name: Рушникосушарка

  # Сучасний блок для всіх template-сутностей
  template:
    - binary_sensor:
        - name: "Автовідключення світла у ванній"
          unique_id: bath_no_motion_sensor
          state: >
            {{ is_state('light.bath_light', 'on')  
              and is_state('binary_sensor.aqara_presence_sensor_bath_occupancy', 'off') }}
          icon: >-
            {% if is_state("binary_sensor.bath_no_motion", "on") %}
              mdi:timer
            {% else %}
              mdi:timer-off
            {% endif %}

    - fan:
        - name: "Bath Fan"
          unique_id: bath_fan_virtual
          state: "{{ states('switch.aqara_wall_switch_d2_bath_right') }}"
          turn_on:
            action: switch.turn_on
            target:
              entity_id: switch.aqara_wall_switch_d2_bath_right
          turn_off:
            action: switch.turn_off
            target:
              entity_id: switch.aqara_wall_switch_d2_bath_right

  light:
    - platform: switch
      name: bath_light
      entity_id: switch.aqara_wall_switch_d2_bath_left

  timer:
    bath_light_countdown:
      name: Світло у ванній вимкнеться через
      duration: "00:10:00"

    bath_fan_countdown:
      name: Вентиляція у ванній вимкнеться через
      duration: "00:05:00"

    bath_towel_heater_countdown:
      name: Рушникосушаврка вимкнеться через
      duration: "01:00:00"

  automation:
    # Ввімкнення освітлення
    - alias: bath_light_on
      initial_state: true
      trigger:
        # Вимикач Aqara
        - platform: state
          entity_id: sensor.aqara_wall_switch_d2_bath_action
          to: "single_left"
        # Датчик руху
        - platform: state
          entity_id: binary_sensor.aqara_presence_sensor_bath_occupancy
          to: "on"
      condition:
        - condition: state
          entity_id: light.bath_light
          state: "off"
      action:
        - action: light.turn_on
          target:
            entity_id: light.bath_light

    # Вимкнення освітлення
    - alias: bath_light_off
      initial_state: true
      trigger:
        # Вимикач Aqara
        - platform: state
          entity_id: sensor.aqara_wall_switch_d2_bath_action
          to: "single_left"
        # Таймер
        - platform: event
          event_type: timer.finished
          event_data:
            entity_id: timer.bath_light_countdown
      condition:
        - condition: state
          entity_id: light.bath_light
          state: "on"
      action:
        - choose:
            - conditions:
                - condition: state
                  entity_id: fan.bath_fan
                  state: "on"
              sequence:
                - action: timer.start
                  target:
                    entity_id: timer.bath_fan_countdown
                - action: light.turn_off
                  target:
                    entity_id: light.bath_light
          default:
            - action: light.turn_off
              target:
                entity_id: light.bath_light

    # Таймер автовідключення
    - alias: bath_light_timer_start
      initial_state: true
      trigger:
        # Умови для запуска таймера автовідключення
        - platform: state
          entity_id: binary_sensor.bath_no_motion
          to: "on"
      action:
        - action: timer.start
          target:
            entity_id: timer.bath_light_countdown
          data:
            duration: >
              {%- if states("binary_sensor.night_time_light") == 'on' -%}
                00:00:10
              {%- elif states("binary_sensor.day_time_light") == 'on'  -%}
                00:00:45
              {%- else -%}
                00:00:45
              {%- endif %}

    # Скидання таймера при вимкненні
    - alias: bath_light_timer_cancel
      initial_state: true
      trigger:
        - platform: state
          entity_id: binary_sensor.bath_no_motion
          to: "off"
      action:
        - action: timer.cancel
          target:
            entity_id: timer.bath_light_countdown

    # Вмикання вентиляції
    - alias: bath_fan_on
      initial_state: true
      trigger:
        # Вимикач Aqara
        - platform: state
          entity_id: sensor.aqara_wall_switch_d2_bath_action
          to: "single_right"
        # Датчик вологості
        - platform: numeric_state
          entity_id: sensor.aqara_temperature_sensor_bath_humidity
          above: 75
      condition:
        - condition: state
          entity_id: fan.bath_fan
          state: "off"
      action:
        - action: fan.turn_on
          target:
            entity_id: fan.bath_fan

    # Вимикання вентиляції
    - alias: bath_fan_off
      initial_state: true
      trigger:
        # Вимикач Aqara
        - id: switch
          platform: state
          entity_id: sensor.aqara_wall_switch_d2_bath_action
          to: "single_right"
        # Таймер
        - id: timer
          platform: event
          event_type: timer.finished
          event_data:
            entity_id: timer.bath_fan_countdown
      condition:
        - condition: state
          entity_id: fan.bath_fan
          state: "on"
      action:
        - if: "{{ trigger.id == 'timer' and (states('sensor.aqara_temperature_sensor_bath_humidity') | int(0)) > 70 }}"
          then:
            - action: timer.start
              target:
                entity_id: timer.bath_fan_countdown
          else:
            - action: fan.turn_off
              target:
                entity_id: fan.bath_fan
            - action: timer.cancel
              target:
                entity_id: timer.bath_fan_countdown

    # Вмикання рушникосушарки
    - alias: towel_heater_on
      initial_state: true
      trigger:
        # Вимикач Aqara
        - platform: state
          entity_id: sensor.aqara_wall_switch_d2_bath_action
          to: "double_right"
        # Таймер
        - id: timer
          platform: event
          event_type: timer.finished
          event_data:
            entity_id: timer.bath_towel_heater_countdown
      action:
        - if: "{{ is_state('switch.aqara_switch_relay_toilet_l1', 'off') }}"
          then:
            - action: timer.start
              target:
                entity_id: timer.bath_towel_heater_countdown
            - action: switch.turn_on
              target:
                entity_id: switch.aqara_switch_relay_toilet_l1
          else:
            - action: switch.turn_off
              target:
                entity_id: switch.aqara_switch_relay_toilet_l1
            - action: timer.cancel
              target:
                entity_id: timer.bath_towel_heater_countdown
