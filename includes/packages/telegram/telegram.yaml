telegramm:
  template:
  - sensor:
      - name: "Всего недоступных светильников - "
        unique_id: unavailable_now_light_counter
        state: "{{ states.light | selectattr('state', 'equalto', 'unavailable') | list | length }}"
        icon: mdi:counter

      - name: "Всего недоступных реле - "
        unique_id: unavailable_now_switch_counter
        state: "{{ states.switch | selectattr('state', 'equalto', 'unavailable') | list | length }}"
        icon: mdi:counter

      - name: "Всего недоступных сенсоров - "
        unique_id: unavailable_now_sensor_counter
        state: "{{ states.sensor | selectattr('state', 'equalto', 'unavailable') | list | length }}"
        icon: mdi:counter

      - name: "Всего недоступных бинарных сенсоров - "
        unique_id: unavailable_now_binary_sensor_counter
        state: "{{ states.binary_sensor | selectattr('state', 'equalto', 'unavailable') | list | length }}"
        icon: mdi:counter


  script:
    send_my_love:
      alias: send my love
      sequence:
        - action: telegram_bot.send_message
          data:
            chat_id: !secret telegram_id_anna
            message: |
              I love you ! {{"\U0001F495"}}{{"\U0001F495"}}{{"\U0001F495"}}

    system_report:
      alias: Отправка отчета о состоянии системы
      sequence:
        - action: telegram_bot.send_message
          data:
            chat_id: !secret telegram_id_alex
            message: |
              {{"\U0001F4AC"}} Головний сервер IntelNuc
              {{"\U0001F4A1"}} Ламп недоступно - {{ states('sensor.unavailable_now_light') }} 
              {{"\U0001F50C"}} Вимикачів недоступно - {{ states('sensor.unavailable_now_switch') }} 
              {{"\U0001F321"}} Сенсорів недоступно - {{ states('sensor.unavailable_now_sensor') }} 
              {{"\U0001F51F"}} Бінарних сенсорів недоступно - {{ states('sensor.unavailable_now_binary_sensor') }}

  automation:
    - id: system status report
      alias: system_status_query
      initial_state: true
      trigger:
        - platform: homeassistant
          event: start
      action:
        - action: telegram_bot.send_message
          data:
            chat_id: !secret telegram_id_alex
            message: |
              {{"\U0001F4AC"}} Головний сервер IntelNuc
              {{"\U0001F567"}} Зафіксований запуск об {{ states('sensor.time') }} 
              {{"\U0001F4C3"}} Звіт про стану очікується через 1 хвилину...
        - delay: 00:01:10
        - service: script.system_report

    # Server status request
    - id: Запрос на отчет
      alias: system_status_report
      initial_state: true
      trigger:
        - platform: event
          event_type: telegram_text
      condition:
        - condition: template
          value_template: >-
            {{ trigger.event.data.text in ["статус", "Статус", "звіт", "Звіт", "report", "status"] }}
      action:
        - service: telegram_bot.send_message
          data:
            chat_id: "{{ trigger.event.data.user_id }}"
            message: |
              {{"\U0001F4AC"}} Головний сервер IntelNuc
              {{"\U0001F567"}} Звіт через {{ states('sensor.time_date') }}
              {{"\U0001F4A1"}} Ламп недоступно - {{ states('sensor.unavailable_now_light') }} 
              {{"\U0001F50C"}} Вимикачів недоступно - {{ states('sensor.unavailable_now_switch') }} 
              {{"\U0001F321"}} Сенсорів недоступно - {{ states('sensor.unavailable_now_sensor') }} 
              {{"\U0001F51F"}} Бінарних сенсорів недоступно - {{ states('sensor.unavailable_now_binary_sensor') }}

    - id: Someone has first entered Home zone
      alias: someone_has_first_entered_home_zone
      initial_state: true
      trigger:
        - platform: numeric_state
          entity_id: zone.home
          above: 0
      action:
        - action: telegram_bot.send_message
          data:
            chat_id: !secret telegram_id_alex
            message: >
              {% for p in state_attr('zone.home', 'persons') %}
              " {{ p }} first enter Home"
              {% endfor %}

    - id: Someone has last exited Home zone
      alias: someone_has_last_exited_home_zone
      initial_state: true
      trigger:
        - platform: numeric_state
          entity_id: zone.home
          below: 1
      action:
        - action: telegram_bot.send_message
          data:
            chat_id: !secret telegram_id_alex
            message: >
              {% for p in state_attr('zone.home', 'persons') %}
              " {{ p }} last exit Home"
              {% endfor %}

    - alias: "IP Change"
      initial_state: true
      trigger:
        - platform: state
          entity_id: sensor.myip
      action:
        - action: telegram_bot.send_message
          data:
            chat_id: !secret telegram_id_alex
            title: "⚠️ *Public IP changed*"
            message: "From {{ trigger.from_state.state }} to {{ trigger.to_state.state }}"

    - alias: "Notify Dog Barks"
      trigger:
        platform: mqtt
        topic: frigate/front_door/audio/#
        encoding: utf-8
      condition:
        and:
          - condition: state
            entity_id: binary_sensor.noone_at_home
            state: "on"
          - or:
              - condition: template
                value_template: "{{ trigger.topic.split('/')[3] == 'yell' }}"
              - condition: template
                value_template: "{{ trigger.topic.split('/')[3] == 'bark' }}"
              - condition: template
                value_template: "{{ trigger.topic.split('/')[3] == 'howl' }}"
              - condition: template
                value_template: "{{ trigger.topic.split('/')[3] == 'bow-wow' }}"
              - condition: template
                value_template: "{{ trigger.topic.split('/')[3] == 'growling' }}"
              - condition: template
                value_template: "{{ trigger.topic.split('/')[3] == 'whimper_dog' }}"
      action:
        - action: telegram_bot.send_message
          data:
            chat_id: !secret telegram_id_alex
            message: "mdi:dog {{trigger.topic.split('/')[3]}} state: {{ trigger.payload }}"
