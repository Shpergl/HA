- binary_sensor:
    - name: "Тривога Київ"
      default_entity_id: binary_sensor.kyiv_alert
      unique_id: kyiv_air_alert_sensor
      device_class: safety
      state: >
        {{ is_state("binary_sensor.m_kiyiv_air", "on") or
            is_state("binary_sensor.m_kiyiv_artillery", "on") or
            is_state("binary_sensor.m_kiyiv_chemical", "on") or
            is_state("binary_sensor.m_kiyiv_nuclear", "on") or
            is_state("binary_sensor.m_kiyiv_unknown", "on") or
            is_state("binary_sensor.m_kiyiv_urban_fights", "on") }}
      icon: >
        {% if is_state("binary_sensor.m_kiyiv_air", "off") %} {{ state_attr('binary_sensor.m_kiyiv_air', 'icon') }}
        {% elif is_state("binary_sensor.m_kiyiv_artillery", "off") %} {{ state_attr('binary_sensor.m_kiyiv_artillery', 'icon') }}
        {% elif is_state("binary_sensor.m_kiyiv_chemical", "off") %} {{ state_attr('binary_sensor.m_kiyiv_chemical', 'icon') }}
        {% elif is_state("binary_sensor.m_kiyiv_nuclear", "off") %} {{ state_attr('binary_sensor.m_kiyiv_nuclear', 'icon') }}
        {% elif is_state("binary_sensor.m_kiyiv_unknown", "off") %} {{ state_attr('binary_sensor.m_kiyiv_unknown', 'icon') }}
        {% elif is_state("binary_sensor.m_kiyiv_urban_fights", "off") %} {{ state_attr('binary_sensor.m_kiyiv_urban_fights', 'icon') }}
        {% endif %}

- sensor:
    - name: "CPU Overspent"
      unique_id: cpu_overspent_sensor
      state: "{{ (states('sensor.processor_use') | int(0)) > 85 }}"



